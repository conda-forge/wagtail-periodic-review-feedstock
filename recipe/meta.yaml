{% set name = "wagtail-periodic-review" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/wagtail_periodic_review-{{ version }}.tar.gz
  sha256: ebb589a3f8fd58a0c49025700cc21be6c02b4d9afb9c559c59a876839be1caf9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - flit-core >=3.2,<4
    - pip
  run:
    - django >=5.2
    - python >={{ python_min }}
    - wagtail >=7.0
    - python-dateutil >=2.8,<3.0.0

test:
  imports:
    - wagtail_periodic_review
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: A Wagtail package for periodic page content reviews
  home: https://github.com/zerolab/wagtail-periodic-review
  dev_url: https://github.com/zerolab/wagtail-periodic-review/blob/main/CHANGELOG.md
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
